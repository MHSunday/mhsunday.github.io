<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>課堂點名</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans TC', sans-serif; }
    .sticky-name { position: sticky; left: 0; background: #fff; z-index: 1; box-shadow: 1px 0 0 #e5e7eb; }
    .sticky-head { position: sticky; top: 0; background: #f3f4f6; z-index: 2; }
    .cell { width: 44px; height: 34px; text-align: center; vertical-align: middle; }
    @media print {
      .no-print { display: none !important; }
      body { background: #fff; }
      .print-block { display: block !important; }
      .matrix-scroll { overflow: visible !important; }
      .sticky-name { position: static; box-shadow: none; }
      .sticky-head { position: static; }
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <nav class="no-print bg-blue-700 text-white shadow-lg">
    <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
      <h1 class="text-xl font-bold">課堂點名</h1>
      <div class="space-x-4">
        <a href="class_portal.html" class="text-sm hover:underline">每班Portal</a>
        <span class="text-white/40">｜</span>
        <a href="form.html" class="text-sm hover:underline">彌撒登記</a>
        <a href="calendar.html" class="text-sm hover:underline">上堂日曆</a>
        <button id="logoutBtn" class="text-sm bg-blue-800 px-3 py-1 rounded hover:bg-blue-900 transition">登出</button>
      </div>
    </div>
  </nav>

  <main class="max-w-5xl mx-auto p-4 mt-4">
    <!-- 控制列 -->
    <div class="no-print bg-white rounded-xl shadow-md p-4 mb-4">
      <div class="flex flex-wrap items-end gap-3">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">班級</label>
          <select id="classSelect" class="border border-gray-300 rounded-md p-2 min-w-[8rem]"></select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">上堂日</label>
          <select id="dateSelect" class="border border-gray-300 rounded-md p-2 min-w-[11rem]"></select>
        </div>
        <div class="flex-1"></div>
        <div class="space-x-2">
          <button id="tabDayBtn" class="px-4 py-2 rounded-md bg-blue-600 text-white text-sm font-bold">當日點名</button>
          <button id="tabMatrixBtn" class="px-4 py-2 rounded-md bg-gray-200 text-gray-700 text-sm font-bold">全年矩陣</button>
        </div>
      </div>
      <div id="backfillBadge" class="hidden mt-2 text-sm font-bold text-orange-600">⚠️ 補填模式：日期早於今日，會記錄補填人與時間</div>
      <div id="message" class="text-center text-sm font-medium min-h-[1.25rem] mt-2"></div>
    </div>

    <!-- 當日點名 -->
    <section id="dayView" class="bg-white rounded-xl shadow-md p-4 mb-4">
      <div class="flex items-center justify-between mb-3 no-print">
        <h2 class="text-lg font-bold">當日出席</h2>
        <div class="space-x-2">
          <button id="allPresentBtn" class="text-sm bg-green-100 text-green-700 px-3 py-1 rounded">全部課堂</button>
          <button id="allMassBtn" class="text-sm bg-orange-100 text-orange-700 px-3 py-1 rounded">全部彌撒</button>
          <button id="clearAllBtn" class="text-sm bg-gray-100 text-gray-600 px-3 py-1 rounded">取消</button>
          <button id="saveDayBtn" class="text-sm bg-blue-600 text-white px-4 py-1.5 rounded font-bold">儲存</button>
        </div>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm border-collapse">
          <thead>
            <tr>
              <th class="border p-2 text-left w-10">#</th>
              <th class="border p-2 text-left">姓名</th>
              <th class="border p-2 text-center w-20">上堂</th>
              <th class="border p-2 text-center w-20 bg-orange-50">彌撒</th>
            </tr>
          </thead>
          <tbody id="dayBody">
            <tr><td colspan="4" class="border p-4 text-center text-gray-400">載入中...</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- 全年矩陣 -->
    <section id="matrixView" class="bg-white rounded-xl shadow-md p-4 mb-4 hidden">
      <div class="flex items-center justify-between mb-3 no-print">
        <h2 class="text-lg font-bold">全年出席矩陣</h2>
        <span class="text-xs text-gray-500">左右滑動睇更多日期；姓名欄固定。上堂（白）／彌撒（橙）／假期（灰）</span>
      </div>
      <div class="matrix-scroll overflow-x-auto">
        <table class="text-xs border-collapse" id="matrixTable">
          <tbody id="matrixBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script type="module" src="js/main-rollcall.js"></script>
</body>
</html>
