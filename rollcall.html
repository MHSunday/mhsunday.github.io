<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>課堂點名</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans TC', sans-serif; }
    .sticky-name { position: sticky; left: 0; background: #fff; z-index: 1; box-shadow: 1px 0 0 #e5e7eb; }
    .sticky-head { position: sticky; top: 0; background: #f3f4f6; z-index: 2; }
    .cell { width: 40px; height: 36px; text-align: center; vertical-align: middle; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- 精簡 Header -->
  <nav class="no-print bg-blue-700 text-white shadow">
    <div class="px-3 py-2 flex justify-between items-center">
      <div class="flex items-center gap-2">
        <a href="class_portal.html" class="text-sm hover:underline">‹ 返回</a>
        <h1 class="text-lg font-bold">課堂點名</h1>
      </div>
      <button id="logoutBtn" class="text-xs bg-blue-800 px-2.5 py-1 rounded hover:bg-blue-900">登出</button>
    </div>
  </nav>

  <!-- 控制列：日期下拉 + 切換 + 動作 -->
  <div class="no-print bg-white border-b border-gray-200 px-3 py-2 sticky top-0 z-10 shadow-sm">
    <div class="flex flex-wrap items-center gap-2">
      <span id="classNameLabel" class="font-bold text-gray-800"></span>
      <select id="dateSelect" class="border border-gray-300 rounded-md px-2 py-1.5 text-base min-w-[8.5rem]"></select>
      <div class="flex-1"></div>
      <button id="tabDayBtn" class="px-3 py-1.5 rounded-md text-sm font-bold bg-blue-600 text-white">當日</button>
      <button id="tabMatrixBtn" class="px-3 py-1.5 rounded-md text-sm font-bold bg-gray-200 text-gray-700">全年</button>
    </div>
    <div class="flex flex-wrap items-center gap-2 mt-2">
      <button id="allPresentBtn" class="text-sm bg-green-100 text-green-700 px-3 py-1.5 rounded">全部課堂</button>
      <button id="clearAllBtn" class="text-sm bg-gray-100 text-gray-600 px-3 py-1.5 rounded">取消</button>
      <div class="flex-1"></div>
      <button id="saveDayBtn" class="text-sm bg-blue-600 text-white px-5 py-1.5 rounded font-bold">儲存</button>
    </div>
    <div id="backfillBadge" class="hidden mt-1 text-xs font-bold text-orange-600">⚠️ 補填模式：日期早於今日</div>
    <div id="message" class="text-center text-sm font-medium min-h-[1.25rem] mt-1"></div>
  </div>

  <!-- 當日點名：全螢幕學生表 -->
  <section id="dayView" class="bg-white">
    <div class="overflow-x-auto">
      <table class="w-full text-base border-collapse">
        <thead>
          <tr>
            <th class="border p-2 text-left w-10">#</th>
            <th class="border p-2 text-left">姓名</th>
            <th class="border p-2 text-center w-16">上堂</th>
            <th class="border p-2 text-center w-16 bg-orange-50">彌撒</th>
          </tr>
        </thead>
        <tbody id="dayBody">
          <tr><td colspan="4" class="border p-4 text-center text-gray-400">載入中...</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <!-- 全年矩陣 -->
  <section id="matrixView" class="bg-white hidden">
    <div class="matrix-scroll overflow-x-auto">
      <table class="text-sm border-collapse" id="matrixTable">
        <tbody id="matrixBody"></tbody>
      </table>
    </div>
  </section>

  <script type="module" src="js/main-rollcall.js"></script>
</body>
</html>
