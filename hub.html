<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>主日學系統</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans TC', sans-serif; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

  <nav class="no-print bg-blue-700 text-white shadow">
    <div class="px-3 py-2 flex justify-between items-center">
      <h1 class="text-lg font-bold">主日學系統</h1>
      <button id="logoutBtn" class="text-xs bg-blue-800 px-2.5 py-1 rounded hover:bg-blue-900">登出</button>
    </div>
  </nav>

  <main class="flex-1 w-full max-w-md mx-auto p-4 flex flex-col justify-center gap-4">
    <div id="welcome" class="text-center text-gray-700 text-sm mb-2">正在載入...</div>

    <button id="portalBtn" class="bg-blue-600 text-white rounded-xl shadow-md p-5 text-left hover:bg-blue-700 active:bg-blue-800 transition">
      <div class="text-xl font-bold">每班 Portal</div>
      <div class="text-sm text-blue-100 mt-1" id="portalDesc">點名 / 學生名單 / 班級檔案</div>
    </button>

    <button id="formBtn" class="bg-white border border-gray-200 rounded-xl shadow-md p-5 text-left hover:border-blue-400 hover:shadow-lg transition">
      <div class="text-xl font-bold text-blue-700">彌撒獎勵</div>
      <div class="text-sm text-gray-500 mt-1">彌撒參與登記 / 換領獎品</div>
    </button>

    <div id="message" class="text-center text-sm font-medium min-h-[1.25rem]"></div>
  </main>

  <script type="module" src="js/main-hub.js"></script>
</body>
</html>
