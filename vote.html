<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anti-Cheat Mobile Poll</title>
    <!-- 修正：使用正確的 Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex flex-col items-center justify-center min-h-screen p-4">

    <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md relative">
        <!-- 載入中遮罩 -->
        <div id="loading" class="hidden absolute inset-0 bg-white/70 flex items-center justify-center rounded-2xl z-10">
            <p class="text-blue-500 font-bold animate-pulse">Processing Mobile Vote...</p>
        </div>

        <h1 class="text-2xl font-bold text-gray-800 text-center mb-6">📊 投票</h1>
        
        <!-- 投票結果條形圖區塊 -->
        <div id="chart-container" class="space-y-4 mb-8"></div>
        
        <!-- 投票按鈕區塊 -->
        <div id="vote-controls" class="grid grid-cols-2 gap-4"></div>
        
        <!-- 已投票提示訊息 -->
        <p id="voted-msg" class="hidden text-center text-green-600 font-semibold mt-4">🎉 Thank you! Your mobile device has successfully voted.</p>

        <!-- 重置投票按鈕（測試 / 重玩用） -->
        <button id="vote-again" class="hidden w-full mt-3 bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-2 px-4 rounded-xl text-sm">
            🔄 再投一次（清除本機紀錄）
        </button>
    </div>

    <!-- 引入邏輯腳本 -->
    <script src="./js/vote.js?v=2" type="module"></script>
</body>
</html>
