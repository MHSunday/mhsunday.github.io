<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poll Admin</title>
    <!-- Firebase SDK（登入驗證用） -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">
    <div class="max-w-2xl mx-auto bg-white p-6 rounded-2xl shadow-xl">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">🛠️ Poll Admin</h1>
        <p class="text-sm text-gray-500 mb-4">管理投票選項與重置投票（需管理員 Google 帳號登入）</p>

        <div class="flex justify-between items-center mb-3">
            <h2 class="text-lg font-bold">目前選項（尚未儲存）</h2>
            <span id="dirty-indicator" class="text-xs text-orange-600 font-semibold hidden">● 有未儲存變更</span>
        </div>
        <div id="options-list" class="space-y-2 mb-6"></div>

        <h2 class="text-lg font-bold mb-2">新增選項</h2>
        <div class="flex flex-col sm:flex-row gap-2 mb-6">
            <input id="option-name" placeholder="選項名稱"
                   class="border border-gray-300 p-2 rounded flex-1 focus:outline-none focus:border-blue-500">
            <select id="option-color" class="border border-gray-300 p-2 rounded">
                <option value="bg-blue-500">藍</option>
                <option value="bg-green-500">綠</option>
                <option value="bg-yellow-500">黃</option>
                <option value="bg-purple-500">紫</option>
                <option value="bg-red-500">紅</option>
                <option value="bg-pink-500">粉</option>
                <option value="bg-indigo-500">靛</option>
                <option value="bg-teal-500">青</option>
            </select>
            <button id="add-option" class="bg-green-500 hover:bg-green-600 text-white font-bold px-4 py-2 rounded whitespace-nowrap">
                ➕ 加入
            </button>
        </div>

        <div class="border-t pt-4 flex flex-col sm:flex-row gap-2">
            <button id="save-btn" class="bg-blue-500 hover:bg-blue-600 text-white font-bold px-4 py-2 rounded flex-1">
                💾 儲存所有變更
            </button>
            <button id="reset-btn" class="bg-red-500 hover:bg-red-600 text-white font-bold px-4 py-2 rounded flex-1">
                🗑️ 重置投票（清空所有票數）
            </button>
        </div>

        <p id="status-msg" class="mt-4 text-sm font-semibold"></p>
        <p class="text-xs text-gray-500 mt-2">
            ⚠️ 儲存或重置後，<code>vote.html</code> 會在下次輪詢（最長 5 秒）自動更新。
        </p>
    </div>

    <script type="module" src="./js/admin.js?v=2"></script>
</body>
</html>
