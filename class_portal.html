<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>班級 Portal</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans TC', sans-serif; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <nav class="bg-blue-700 text-white shadow-lg">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
      <h1 class="text-xl font-bold">班級 Portal</h1>
      <div class="space-x-4">
        <a href="rollcall.html" class="text-sm hover:underline">課堂點名</a>
        <a href="form.html" class="text-sm hover:underline">彌撒登記</a>
        <button id="logoutBtn" class="text-sm bg-blue-800 px-3 py-1 rounded hover:bg-blue-900 transition">登出</button>
      </div>
    </div>
  </nav>

  <main class="max-w-4xl mx-auto p-4 mt-4">
    <div class="bg-white rounded-xl shadow-md p-4 mb-4">
      <div class="flex flex-wrap items-end gap-3">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">班級</label>
          <select id="classSelect" class="border border-gray-300 rounded-md p-2 min-w-[9rem]"></select>
        </div>
        <div class="flex-1"></div>
        <button id="gotoRollcallBtn" class="px-4 py-2 rounded-md bg-blue-600 text-white text-sm font-bold">今日點名</button>
      </div>
      <div id="message" class="text-center text-sm font-medium min-h-[1.25rem] mt-2"></div>
    </div>

    <!-- 今日上堂日 -->
    <div id="todayCard" class="hidden bg-orange-50 border border-orange-200 rounded-xl p-4 mb-4">
      <div class="text-sm text-orange-800"><span class="font-bold">今日上堂：</span><span id="todayInfo"></span></div>
    </div>

    <!-- 出席率 -->
    <div id="attendanceCard" class="hidden bg-white rounded-xl shadow-md p-4 mb-4 flex items-center justify-between">
      <div>
        <h2 class="text-lg font-bold">本班出席率</h2>
        <p class="text-sm text-gray-500"><span id="attendanceInfo"></span>（分母 = 已過嘅上堂日）</p>
      </div>
      <div id="attendancePct" class="text-4xl font-bold text-blue-700">—</div>
    </div>

    <!-- 快速動作 -->
    <div id="actionGrid" class="grid grid-cols-2 md:grid-cols-3 gap-3 mb-4"></div>

    <!-- Links -->
    <div id="linksCard" class="hidden bg-white rounded-xl shadow-md p-4 mb-4">
      <h2 class="text-lg font-bold mb-3">各班檔案</h2>
      <div id="linksBody" class="space-y-2"></div>
    </div>

    <!-- 學生資料（Form 收集） -->
    <div id="detailsCard" class="hidden bg-white rounded-xl shadow-md p-4">
      <h2 class="text-lg font-bold mb-3">學生補充資料 <span class="text-xs text-gray-500 font-normal">（Form 收集）</span></h2>
      <div class="overflow-x-auto">
        <table class="w-full text-sm border-collapse">
          <thead>
            <tr class="bg-gray-100">
              <th class="border p-2 text-left">姓名</th>
              <th class="border p-2 text-left">類別</th>
              <th class="border p-2 text-left">性別</th>
              <th class="border p-2 text-left">就讀學校</th>
              <th class="border p-2 text-left">出生年份</th>
              <th class="border p-2 text-left">聯絡電話</th>
            </tr>
          </thead>
          <tbody id="detailsBody">
            <tr><td colspan="6" class="border p-4 text-center text-gray-400">載入中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script type="module" src="js/main-portal.js"></script>
</body>
</html>
