<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>班級 Portal</title>
  <script src="js/loading.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans TC', sans-serif; }

    /* 手機：漢堡選單；桌面 (>768px)：原本橫向 link */
    #navLinks { display: none; }
    #navLinks.open {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 2px;
      width: 100%;
      padding-top: 6px;
    }
    #navLinks.open a,
    #navLinks.open button#logoutBtn {
      display: block;
      width: 100%;
      text-align: left;
      padding: 10px 8px;
      border-radius: 8px;
      font-size: 15px;
    }
    #navLinks.open a:hover { background: rgba(255,255,255,.08); }

    @media (min-width: 768px) {
      #navLinks {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 1rem;
        width: auto;
        padding-top: 0;
      }
      #navLinks a,
      #navLinks button#logoutBtn {
        display: inline-block;
        width: auto;
        padding: 0;
        background: none;
        font-size: 14px;
      }
      #menuToggle { display: none; }
    }
  </style>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1d4ed8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="望廈主日學">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body class="bg-gray-50 min-h-screen">

  <nav class="bg-blue-700 text-white shadow-lg">
    <div class="max-w-4xl mx-auto px-4 py-2">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <h1 class="text-xl font-bold">每班 Portal</h1>
        <button id="menuToggle" type="button"
          class="md:hidden text-sm bg-blue-800 px-3 py-1.5 rounded hover:bg-blue-900 transition"
          aria-controls="navLinks" aria-expanded="false">☰ 選單</button>

        <div id="navLinks">
          <a href="rollcall.html" class="text-sm hover:underline">課堂點名</a>
          <a href="admin_sessions.html" id="adminSessionsLink" class="hidden text-sm hover:underline">上堂日曆管理</a>
          <a href="admin_calendar.html" id="adminCalendarLink" class="hidden text-sm hover:underline">班級行事曆</a>
          <a href="notices.html" class="text-sm hover:underline">公告·檔案</a>
          <a href="reward.html" id="rewardLink" class="text-sm hover:underline">獎勵統計</a>
          <a href="food.html" id="foodLink" class="text-sm hover:underline">活動回覆</a>
          <a href="form.html" id="formLink" class="hidden text-sm hover:underline">彌撒登記</a>
          <button id="logoutBtn" class="text-sm bg-blue-800 px-3 py-1 rounded hover:bg-blue-900 transition">登出</button>
        </div>
      </div>
    </div>
  </nav>

  <main class="max-w-4xl mx-auto p-4 mt-4">
    <div class="bg-white rounded-xl shadow-md p-4 mb-4">
      <div class="flex flex-wrap items-end gap-3">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">班級</label>
          <select id="classSelect" class="border border-gray-300 rounded-md p-2 min-w-[9rem]"></select>
        </div>
        <div class="flex-1"></div>
        <button id="gotoRollcallBtn" class="px-4 py-2 rounded-md bg-blue-600 text-white text-sm font-bold">今日點名</button>
      </div>
      <div id="message" class="text-center text-sm font-medium min-h-[1.25rem] mt-2"></div>
    </div>

    <!-- 今日上堂日 -->
    <div id="todayCard" class="hidden bg-orange-50 border border-orange-200 rounded-xl p-4 mb-4">
      <div class="text-sm text-orange-800"><span class="font-bold">今日上堂：</span><span id="todayInfo"></span></div>
    </div>

    <!-- 出席率 -->
    <div id="attendanceCard" class="hidden bg-white rounded-xl shadow-md p-4 mb-4 flex items-center justify-between">
      <div>
        <h2 class="text-lg font-bold">本班出席率</h2>
        <p class="text-sm text-gray-500"><span id="attendanceInfo"></span>（分母 = 已過嘅上堂日）</p>
      </div>
      <div id="attendancePct" class="text-4xl font-bold text-blue-700">—</div>
    </div>

    <!-- 快速動作 -->
    <div id="actionGrid" class="grid grid-cols-2 md:grid-cols-3 gap-3 mb-4"></div>

    <!-- 學生名單 -->
    <div id="rosterCard" class="hidden bg-white rounded-xl shadow-md p-4 mb-4">
      <h2 class="text-lg font-bold mb-3">學生名單 <span id="rosterCount" class="text-xs text-gray-500"></span></h2>
      <div class="flex flex-wrap gap-2" id="rosterBody"></div>
    </div>

    <!-- Links -->
    <div id="linksCard" class="hidden bg-white rounded-xl shadow-md p-4 mb-4">
      <h2 class="text-lg font-bold mb-3">各班檔案</h2>
      <div id="linksBody" class="space-y-2"></div>
    </div>

    <!-- 學生資料（Form 收集） -->
    <div id="detailsCard" class="hidden bg-white rounded-xl shadow-md p-4">
      <h2 class="text-lg font-bold mb-3">學生補充資料 <span class="text-xs text-gray-500 font-normal">（Form 收集）</span></h2>
      <div class="overflow-x-auto">
        <table class="w-full text-sm border-collapse">
          <thead>
            <tr class="bg-gray-100">
              <th class="border p-2 text-left">姓名</th>
              <th class="border p-2 text-left">類別</th>
              <th class="border p-2 text-left">性別</th>
              <th class="border p-2 text-left">就讀學校</th>
              <th class="border p-2 text-left">出生年份</th>
              <th class="border p-2 text-left">聯絡電話</th>
            </tr>
          </thead>
          <tbody id="detailsBody">
            <tr><td colspan="6" class="border p-4 text-center text-gray-400">載入中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script type="module" src="js/main-portal.js"></script>
</body>
</html>
