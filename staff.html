<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校務看板</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans TC', sans-serif; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <nav class="bg-blue-700 text-white shadow">
    <div class="px-3 py-2 flex justify-between items-center">
      <h1 class="text-lg font-bold">校務看板</h1>
      <div class="space-x-4 flex items-center">
        <a href="notices.html" class="text-sm hover:underline">通告·檔案</a>
        <a href="calendar.html" class="text-sm hover:underline">上堂日曆</a>
        <button id="logoutBtn" class="text-xs bg-blue-800 px-2.5 py-1 rounded hover:bg-blue-900">登出</button>
      </div>
    </div>
  </nav>

  <main class="w-full max-w-3xl mx-auto p-4">

    <!-- 通告・檔案 -->
    <div class="bg-white rounded-xl shadow-md p-4 mb-4">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-lg font-bold">通告 · 檔案</h2>
        <a href="notices.html" class="text-sm text-blue-700 font-bold hover:underline">顯示全部 →</a>
      </div>
      <div id="noticesBody" class="space-y-2"></div>
    </div>

    <!-- 出席統計（學生） -->
    <div class="bg-white rounded-xl shadow-md p-4">
      <h2 class="text-lg font-bold mb-3">出席統計（學生）</h2>
      <div class="flex flex-wrap items-center gap-3 mb-3">
        <label class="text-sm text-gray-600">班級</label>
        <select id="classSelect" class="border border-gray-300 rounded-md p-2 min-w-[10rem]"></select>
      </div>
      <div id="message" class="text-center text-sm font-medium min-h-[1.25rem] mb-2"></div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm border-collapse">
          <thead>
            <tr class="bg-gray-100">
              <th class="border p-2 text-left">姓名</th>
              <th class="border p-2 text-left">類別</th>
              <th class="border p-2 text-center">彌撒次數<div class="text-xs text-gray-500 font-normal">／39 主日</div></th>
              <th class="border p-2 text-center">出席次數<div class="text-xs text-gray-500 font-normal">／31 堂</div></th>
              <th class="border p-2 text-center">出席率</th>
            </tr>
          </thead>
          <tbody id="statsBody">
            <tr><td colspan="5" class="border p-4 text-center text-gray-400">載入中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script type="module" src="js/main-staff.js"></script>
</body>
</html>
