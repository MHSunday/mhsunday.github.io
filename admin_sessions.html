<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>上堂日曆管理</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans TC', sans-serif; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <nav class="bg-blue-700 text-white shadow-lg">
    <div class="max-w-3xl mx-auto px-4 py-3 flex justify-between items-center">
      <h1 class="text-xl font-bold">上堂日曆管理</h1>
      <div class="space-x-4">
        <a href="form.html" class="text-sm hover:underline">彌撒登記</a>
        <button id="logoutBtn" class="text-sm bg-blue-800 px-3 py-1 rounded hover:bg-blue-900 transition">登出</button>
      </div>
    </div>
  </nav>

  <main class="max-w-3xl mx-auto p-4 mt-4">
    <div class="bg-white rounded-xl shadow-md p-6">

      <div class="flex items-center justify-between mb-4">
        <div>
          <h2 class="text-lg font-bold">2026-2027 上堂日</h2>
          <p class="text-sm text-gray-500">類型：上課 / 活動 / 假期 / 停課。逐日修改後按「儲存」。</p>
        </div>
        <div class="space-x-2">
          <button id="resetBtn" class="text-sm bg-orange-500 text-white px-3 py-2 rounded hover:bg-orange-600 transition">一鍵重置</button>
          <button id="saveBtn" class="text-sm bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">儲存</button>
        </div>
      </div>

      <div id="message" class="text-center text-sm font-medium min-h-[1.25rem] mb-2"></div>

      <div class="overflow-x-auto">
        <table class="w-full text-sm border-collapse">
          <thead>
            <tr class="bg-gray-100">
              <th class="border p-2 text-left w-28">日期</th>
              <th class="border p-2 text-left w-28">類型</th>
              <th class="border p-2 text-left">備註</th>
            </tr>
          </thead>
          <tbody id="sessionsBody">
            <tr><td colspan="3" class="border p-4 text-center text-gray-400">載入中...</td></tr>
          </tbody>
        </table>
      </div>

    </div>
  </main>

  <script type="module" src="js/main-sessions.js"></script>
</body>
</html>
