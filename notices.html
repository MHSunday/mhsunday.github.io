<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>公告 · 檔案</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans TC', sans-serif; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <nav class="bg-blue-700 text-white shadow">
    <div class="px-3 py-2 flex justify-between items-center">
      <div class="flex items-center gap-2">
        <a href="hub.html" class="text-sm hover:underline">‹ 返回</a>
        <h1 class="text-lg font-bold">公告 · 檔案</h1>
      </div>
      <button id="logoutBtn" class="text-xs bg-blue-800 px-2.5 py-1 rounded hover:bg-blue-900">登出</button>
    </div>
  </nav>

  <main class="w-full max-w-2xl mx-auto p-4">

    <!-- 類別 filter -->
    <div class="flex gap-2 mb-3">
      <button data-filter="all" class="filterBtn px-3 py-1.5 rounded-md text-sm font-bold bg-blue-600 text-white">全部</button>
      <button data-filter="公告" class="filterBtn px-3 py-1.5 rounded-md text-sm font-bold bg-gray-200 text-gray-700">公告</button>
      <button data-filter="檔案" class="filterBtn px-3 py-1.5 rounded-md text-sm font-bold bg-gray-200 text-gray-700">檔案</button>
      <button data-filter="活動" class="filterBtn px-3 py-1.5 rounded-md text-sm font-bold bg-gray-200 text-gray-700">活動</button>
      <div class="flex-1"></div>
      <button id="showFormBtn" class="hidden no-print px-3 py-1.5 rounded-md bg-blue-600 text-white text-sm font-bold">＋ 新增公告</button>
    </div>

    <!-- Admin 新增/編輯表單 -->
    <div id="noticeForm" class="hidden no-print bg-white rounded-xl shadow-md p-4 mb-4">
      <h2 id="formTitle" class="text-lg font-bold mb-3">新增公告</h2>
      <div class="flex flex-wrap gap-2">
        <input id="nTitle" class="flex-1 min-w-[12rem] border border-gray-300 rounded-md px-2 py-1.5 text-sm" placeholder="標題（必填）…">
        <select id="nCategory" class="border border-gray-300 rounded-md px-2 py-1.5 text-sm">
          <option value="公告">公告</option>
          <option value="檔案">檔案</option>
          <option value="活動">活動</option>
        </select>
        <input id="nDate" type="date" class="border border-gray-300 rounded-md px-2 py-1.5 text-sm">
      </div>
      <input id="nLink" class="mt-2 w-full border border-gray-300 rounded-md px-2 py-1.5 text-sm" placeholder="連結（可選，檔案/網頁 link）…">
      <input id="nFileName" class="mt-2 w-full border border-gray-300 rounded-md px-2 py-1.5 text-sm" placeholder="檔名（可選，例如：開學須知.pdf）…">
      <textarea id="nBody" rows="2" class="mt-2 w-full border border-gray-300 rounded-md px-2 py-1.5 text-sm" placeholder="內容（可選）…"></textarea>
      <label class="flex items-center gap-2 mt-3 text-sm text-gray-700">
        <input id="nPinned" type="checkbox" class="h-4 w-4">
        置頂
      </label>
      <div class="flex gap-2 mt-3">
        <button id="saveBtn" class="px-4 py-2 rounded-md bg-blue-600 text-white text-sm font-bold">儲存</button>
        <button id="cancelBtn" class="px-4 py-2 rounded-md bg-gray-200 text-gray-700 text-sm">取消</button>
      </div>
    </div>

    <!-- 列表 -->
    <div id="noticesBody" class="space-y-3"></div>
    <div id="message" class="text-center text-sm font-medium min-h-[1.25rem] mt-2"></div>

  </main>

  <script type="module" src="js/main-notices.js"></script>
</body>
</html>
