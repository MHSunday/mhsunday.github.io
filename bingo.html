<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BINGO</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft JhengHei', '微軟正黑體', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f9e7b8, #f3d99d, #f9e7b8);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 255, 255, 0.2) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(255, 255, 255, 0.2) 0%, transparent 20%),
                url("image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23e6c88a' fill-opacity='0.15'%3E%3Ccircle cx='40' cy='40' r='2'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }
        
        .container {
            display: flex;
            max-width: 1200px;
            width: 100%;
            background: #fdf8ee;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(101, 67, 33, 0.25);
            overflow: hidden;
            border: 1px solid #e8c98a;
            position: relative;
        }
        
        .main-section {
            flex: 1;
            padding: 30px;
            background: linear-gradient(to bottom, #fdf8ee, #f8efd5);
            color: #5a3e2b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            border-right: 1px solid #e8c98a;
        }
        
        .history-section {
            width: 300px;
            padding: 20px;
            background: #fdf9e7;
            display: flex;
            flex-direction: column;
            border-left: 1px solid #e8c98a;
            min-width: 300px; /* Set a minimum width but allow it to be scrollable */
        }
        
        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 2.5rem;
            color: #5a3e2b;
            text-shadow: 0 1px 2px rgba(255, 223, 0, 0.3);
            position: relative;
            padding-bottom: 15px;
        }
        
        h1::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 25%;
            right: 25%;
            height: 3px;
            background: linear-gradient(to right, transparent, #d4af37, transparent);
            border-radius: 2px;
        }
        
        .bingo-display {
            width: 200px;
            height: 200px;
            background: linear-gradient(145deg, #f8efd5, #f0e0c0);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
            box-shadow: 
                0 8px 20px rgba(101, 67, 33, 0.15),
                inset 0 0 20px rgba(212, 175, 55, 0.2);
            position: relative;
            border: 2px solid #d4af37;
            overflow: hidden;
        }
        
        .bingo-display::before {
            content: "";
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            background: linear-gradient(45deg, 
                rgba(212, 175, 55, 0.3), 
                rgba(101, 67, 33, 0.15), 
                rgba(212, 175, 55, 0.3));
            border-radius: 50%;
            z-index: -1;
            animation: rotate 4s linear infinite;
        }
        
        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .number-display {
            font-size: 6rem;
            font-weight: bold;
            color: #5a3e2b;
            text-shadow: 0 2px 6px rgba(212, 175, 55, 0.5);
            z-index: 2;
            font-family: 'Georgia', serif;
        }
        
        .controls {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        
        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(101, 67, 33, 0.15);
            font-family: 'Microsoft JhengHei', sans-serif;
        }
        
        #draw-btn {
            background: linear-gradient(to right, #d4af37, #b8860b);
            color: #fdf8ee;
            flex: 1;
            max-width: 200px;
            border: 2px solid #b8860b;
        }
        
        #draw-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(101, 67, 33, 0.2);
            background: linear-gradient(to right, #e0b847, #c8961b);
        }
        
        #draw-btn:active {
            transform: translateY(1px);
        }
        
        #reset-btn {
            background: linear-gradient(to right, #c9ae5d, #a67c00);
            color: #fdf8ee;
            flex: 1;
            max-width: 200px;
            border: 2px solid #a67c00;
        }
        
        #reset-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(101, 67, 33, 0.2);
            background: linear-gradient(to right, #d9be6d, #b68c10);
        }
        
        #reset-btn:active {
            transform: translateY(1px);
        }
        
        .history-title {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: #5a3e2b;
            text-align: center;
            padding-bottom: 10px;
            border-bottom: 2px solid #d4af37;
            position: relative;
        }
        
        .history-title::after {
            content: "★";
            position: absolute;
            top: -8px;
            right: 10px;
            color: #d4af37;
            font-size: 1.2rem;
            text-shadow: 0 0 8px rgba(212, 175, 55, 0.7);
        }
        
        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(50px, 1fr));
            grid-auto-rows: 40px; /* Fixed row height to match history item height */
            gap: 10px;
            max-height: calc(100vh - 20px); /* Adjust based on viewport height */
            overflow-y: auto;
            padding-right: 5px;
            padding-top: 5px;
            flex: 1; /* Allow to grow and fill available space */
            align-content: start; /* Stack items from the top */
        }
        
        .history-list::-webkit-scrollbar {
            width: 8px;
        }
        
        .history-list::-webkit-scrollbar-track {
            background: #f8efd5;
            border-radius: 10px;
        }
        
        .history-list::-webkit-scrollbar-thumb {
            background: #d4af37;
            border-radius: 10px;
        }
        
        .history-item {
            background: #fdf8ee;
            padding: 10px;
            text-align: center;
            border-radius: 8px;
            font-weight: bold;
            color: #5a3e2b;
            box-shadow:
                0 2px 4px rgba(101, 67, 33, 0.1),
                inset 0 0 4px rgba(212, 175, 55, 0.2);
            border: 1px solid #e8c98a;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
            height: 40px; /* Set fixed height for consistent appearance */
            /* display: flex; */
            align-items: center;
            justify-content: center;
        }
        
        .history-item:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 4px 8px rgba(101, 67, 33, 0.15),
                inset 0 0 6px rgba(212, 175, 55, 0.3);
            border-color: #d4af37;
        }
        
        .history-item::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(to right, 
                #d4af37, 
                #a67c00, 
                #d4af37);
        }
        
        .counter {
            margin-top: 15px;
            font-size: 1.2rem;
            background: linear-gradient(to right, #f8efd5, #f0e0c0);
            padding: 10px 20px;
            border-radius: 50px;
            border: 1px solid #e8c98a;
            color: #5a3e2b;
            font-weight: bold;
        }
        
        .instructions {
            margin-top: 25px;
            text-align: center;
            font-size: 0.9rem;
            max-width: 400px;
            line-height: 1.5;
            background: #fdf8ee;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #e8c98a;
            color: #5a3e2b;
        }
        
        .highlight {
            color: #b8860b;
            font-weight: bold;
        }
        
        /* 聲效狀態指示 */
        .audio-status {
            margin-top: 15px;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            color: #5a3e2b;
            background: #f8efd5;
            border: 1px solid #e8c98a;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .audio-status.ready {
            color: #2e7d32;
            background: #e8f5e9;
            border-color: #a5d6a7;
        }
        
        .audio-status span {
            font-size: 1.2rem;
        }
        
        /* 背景音樂控制按鈕 */
        .music-control {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(253, 248, 238, 0.8);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(101, 67, 33, 0.2);
            border: 1px solid #e8c98a;
            z-index: 10;
            transition: all 0.3s;
        }
        
        .music-control:hover {
            transform: scale(1.1);
            background: rgba(253, 248, 238, 1);
        }
        
        .music-icon {
            font-size: 1.2rem;
            color: #d4af37;
        }
        
        .music-icon.muted {
            color: #a67c00;
        }
        
        /* 主顯節裝飾元素 */
        .star-decoration {
            position: absolute;
            color: #d4af37;
            font-size: 1.5rem;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.7);
            z-index: 1;
            animation: twinkle 3s infinite;
        }
        
        .star-1 { top: 20px; left: 30px; animation-delay: 0s; }
        .star-2 { top: 40px; right: 40px; animation-delay: 1s; }
        .star-3 { bottom: 30px; left: 50px; animation-delay: 2s; }
        
        @keyframes twinkle {
            0%, 100% { opacity: 0.7; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        
        @media (max-width: 900px) {
            .container {
                flex-direction: column;
            }
            
            .history-section {
                width: 100%;
                max-height: none;
                min-height: 100px;
                flex: none;
                border-left: none;
                border-top: 1px solid #e8c98a;
            }
            
            .main-section {
                border-right: none;
                border-bottom: 1px solid #e8c98a;
            }
            
            .bingo-display {
                width: 150px;
                height: 150px;
            }
            
            .number-display {
                font-size: 4.5rem;
            }
            
            .music-control {
                top: 10px;
                right: 10px;
            }
        }
        
        /* Additional responsive styles for the history list on mobile devices */
        @media (max-width: 768px) {
            .history-list {
                grid-template-columns: repeat(4, 1fr);
                max-height: none;
            }
            
            .history-item {
                padding: 10px;
                font-size: 1rem;
                min-height: 50px;
            }
        }
        
        @media (max-width: 480px) {
            .history-list {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
                max-height: none;
            }
            
            .history-item {
                padding: 10px;
                font-size: 1rem;
                min-height: 50px;
            }
        }
        
        @media (max-width: 360px) {
            .history-list {
                grid-template-columns: repeat(2, 1fr);
                gap: 6px;
                max-height: none;
            }
            
            .history-item {
                padding: 10px;
                font-size: 1rem;
                min-height: 50px;
            }
        }
    </style>

<body>
    <!-- 
        設定總數目：修改 data-total-number 的值
        例如：data-total-number="75" (預設)
               data-total-number="90" (90號)
               data-total-number="50" (50號)
    -->
    <div class="container" id="bingo-container" data-total-number="75">
        <!-- 背景音樂控制按鈕 -->
        <div class="music-control" id="music-toggle">
            <div class="music-icon" id="music-icon">♪</div>
        </div>
        
        <div class="main-section">
            <!-- 主顯節星星裝飾 -->
            <div class="star-decoration star-1">★</div>
            <div class="star-decoration star-2">★</div>
            <div class="star-decoration star-3">★</div>
            
            <h1>BINGO!</h1>
            <div class="bingo-display">
                <div class="number-display" id="current-number">?</div>
            </div>
            
            <div class="counter">
                已抽取: <span id="drawn-count">0</span> / <span id="total-count">75</span>
            </div>
            
            <!-- 聲效狀態指示器 -->
            <div class="audio-status" id="audio-status">
                <span>🔊</span> 請點擊頁面啟用音效
            </div>
            
            <div class="controls">
                <button id="draw-btn">抽獎</button>
                <button id="reset-btn">重置</button>
            </div>
            
            <div class="instructions">
                點擊 <span class="highlight">"抽獎"</span> 按鈕隨機抽取 1-<span id="total-instruction">75</span> 號數字<br>
                點擊 <span class="highlight">"重置"</span> 按鈕重置所有抽取記錄
            </div>
        </div>
        
        <div class="history-section">
            <h2 class="history-title">已抽取數字</h2>
            <div class="history-list" id="history-list"></div>
        </div>
    </div>

    <!-- 背景音樂 (主顯節風格) -->
    <audio id="background-music" preload="auto" loop>
        <source src="mixkit-december-treats-867.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
    
    <!-- 抽獎音效 -->
    <audio id="draw-sound" preload="auto">
        <source src="mixkit-winning-notification-2018.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

  <script src="js/loading.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 從 HTML 讀取總數目參數
            const container = document.getElementById('bingo-container');
            const totalNumber = parseInt(container.getAttribute('data-total-number')) || 75;
            
            // 更新介面顯示
            document.getElementById('total-count').textContent = totalNumber;
            document.getElementById('total-instruction').textContent = totalNumber;
            
            // 元件
            const currentNumberEl = document.getElementById('current-number');
            const historyListEl = document.getElementById('history-list');
            const drawnCountEl = document.getElementById('drawn-count');
            const drawBtn = document.getElementById('draw-btn');
            const resetBtn = document.getElementById('reset-btn');
            const drawSound = document.getElementById('draw-sound');
            const backgroundMusic = document.getElementById('background-music');
            const musicToggle = document.getElementById('music-toggle');
            const musicIcon = document.getElementById('music-icon');
            const audioStatus = document.getElementById('audio-status');
            
            // 狀態
            let numbers = Array.from({length: totalNumber}, (_, i) => i + 1);
            let drawnNumbers = [];
            let isAnimating = false;
            let isMusicPlaying = true;
            let audioReady = false;
            
            // 從本地存儲加載已抽取的數字
            function loadDrawnNumbersFromStorage() {
                const storageKey = `bingo_drawn_numbers_${totalNumber}`;
                const stored = localStorage.getItem(storageKey);
                if (stored) {
                    drawnNumbers = JSON.parse(stored);
                    // 從原始數組中移除已抽取的數字
                    numbers = numbers.filter(num => !drawnNumbers.includes(num));
                } else {
                    drawnNumbers = [];
                }
            }
            
            // 保存已抽取的數字到本地存儲
            function saveDrawnNumbersToStorage() {
                const storageKey = `bingo_drawn_numbers_${totalNumber}`;
                localStorage.setItem(storageKey, JSON.stringify(drawnNumbers));
            }
            
            // 清除本地存儲中的已抽取數字
            function clearDrawnNumbersFromStorage() {
                const storageKey = `bingo_drawn_numbers_${totalNumber}`;
                localStorage.removeItem(storageKey);
            }
            
            // 音訊初始化狀態
            function updateAudioStatus() {
                if (audioReady) {
                    audioStatus.innerHTML = '<span>🔊</span> 音效已啟用';
                    audioStatus.classList.add('ready');
                } else {
                    audioStatus.innerHTML = '<span>🔇</span> 請點擊頁面啟用音效';
                    audioStatus.classList.remove('ready');
                }
            }
            
            // 初始化音訊
            function initAudio() {
                if (audioReady) return;
                
                // 嘗試播放背景音樂
                backgroundMusic.volume = 0.3;
                backgroundMusic.play().then(() => {
                    console.log("背景音樂已啟用");
                }).catch(e => {
                    console.log("背景音樂播放被阻止:", e);
                });
                
                // 嘗試預載抽獎音效
                drawSound.load();
                
                audioReady = true;
                updateAudioStatus();
                
                // 移除點擊監聽器
                document.body.removeEventListener('click', initAudio);
                document.body.removeEventListener('touchstart', initAudio);
            }
            
            // 設置點擊事件以啟用音訊
            document.body.addEventListener('click', initAudio);
            document.body.addEventListener('touchstart', initAudio);
            
            // 音樂開關功能
            musicToggle.addEventListener('click', function(e) {
                e.stopPropagation(); // 防止觸發音訊初始化
                
                if (!audioReady) {
                    initAudio();
                    return;
                }
                
                if (isMusicPlaying) {
                    backgroundMusic.pause();
                    musicIcon.textContent = '♬';
                    musicIcon.classList.add('muted');
                    isMusicPlaying = false;
                } else {
                    backgroundMusic.play().catch(e => console.log("Background music play failed:", e));
                    musicIcon.textContent = '♪';
                    musicIcon.classList.remove('muted');
                    isMusicPlaying = true;
                }
            });
            
            // 初始化
            loadDrawnNumbersFromStorage();
            // 重建歷史記錄顯示
            drawnNumbers.forEach(num => addToHistory(num));
            updateDrawnCount();
            updateAudioStatus();
            
            // 抽獎功能
            drawBtn.addEventListener('click', function(e) {
                if (!audioReady) {
                    initAudio();
                }
                drawNumber();
            });
            
            // 重置功能
            resetBtn.addEventListener('click', function(e) {
                if (!audioReady) {
                    initAudio();
                }
                resetAll();
            });
            
            // 抽取數字
            function drawNumber() {
                if (isAnimating || numbers.length === 0) return;
                
                isAnimating = true;
                drawBtn.disabled = true;
                resetBtn.disabled = true;
                
                // 動畫效果 - 隨機數字滾動
                animateNumber();
            }
            
            // 數字動畫（無音效）
            function animateNumber() {
                let animationCount = 0;
                const maxAnimations = 20;
                const animationInterval = setInterval(() => {
                    const randomNum = Math.floor(Math.random() * totalNumber) + 1;
                    currentNumberEl.textContent = randomNum;
                    currentNumberEl.style.transform = `scale(${1 + Math.sin(animationCount * 0.5) * 0.2})`;
                    animationCount++;
                    
                    if (animationCount > maxAnimations) {
                        clearInterval(animationInterval);
                        finalizeDraw();
                    }
                }, 100);
            }
            
            // 完成抽獎（此時播放音效）
           function finalizeDraw() {
               const index = Math.floor(Math.random() * numbers.length);
               const drawnNumber = numbers.splice(index, 1)[0];
               drawnNumbers.push(drawnNumber);
               
               // 顯示最終數字
               currentNumberEl.textContent = drawnNumber;
               currentNumberEl.style.transform = 'scale(1)';
               
               // 更新歷史記錄
               addToHistory(drawnNumber);
               updateDrawnCount();
               
               // 保存到本地存儲
               saveDrawnNumbersToStorage();
               
               // 播放抽獎完成音效（僅在此處播放）
               if (audioReady) {
                   drawSound.currentTime = 0;
                   drawSound.play()
                   .then(() => {
                       // 音效播放完成後延遲一點時間再進行語音
                       setTimeout(() => {
                           speakNumberInCantonese(drawnNumber);
                       }, 300); // 延遲300毫秒以確保音效不會與語音重疊
                   })
                   .catch(e => {
                       console.log("Draw sound play failed:", e);
                       // 如果音效播放失敗，仍然進行語音
                       speakNumberInCantonese(drawnNumber);
                   });
               } else {
                   // 如果音效未準備好，直接進行語音
                   speakNumberInCantonese(drawnNumber);
               }
               
               // 恢復按鈕
               isAnimating = false;
               drawBtn.disabled = false;
               resetBtn.disabled = false;
               
               // 如果抽完所有數字
               if (numbers.length === 0) {
                   drawBtn.textContent = '已完成';
                   drawBtn.style.background = 'linear-gradient(to right, #c9ae5d, #a67c00)';
               }
           }
           
           // 粵語語音功能 - 修正版本 for iOS compatibility
           function speakNumberInCantonese(number) {
               if ('speechSynthesis' in window) {
                   // 創建語音內容
                   const numberString = number.toString();
                   const speech = new SpeechSynthesisUtterance(numberString);
                   
                   // 設定語音屬性
                   speech.lang = 'zh-HK'; // 使用粵語
                   speech.rate = 0.5; // 語速調整到合適範圍 (0.1-2.0)
                   speech.pitch = 1.0; // 音調正常
                   speech.volume = 1.0; // 音量最大 (0-1)
                   
                   // 獲取語音列表 - iOS需要等待voices載入
                   const voices = speechSynthesis.getVoices();
                   let cantoneseVoice = null;
                   
                   // 尋找粵語語音
                   for (let i = 0; i < voices.length; i++) {
                       if (voices[i].lang.includes('zh-HK') || voices[i].lang.includes('yue')) {
                           cantoneseVoice = voices[i];
                           break;
                       }
                   }
                   
                   // 如果沒有找到粵語語音，嘗試使用中文語音
                   if (!cantoneseVoice) {
                       for (let i = 0; i < voices.length; i++) {
                           if (voices[i].lang.includes('zh')) {
                               cantoneseVoice = voices[i];
                               break;
                           }
                       }
                   }
                   
                   // 如果找到合適的語音，則使用它
                   if (cantoneseVoice) {
                       speech.voice = cantoneseVoice;
                   }
                   
                   // 執行語音
                   speechSynthesis.speak(speech);
               } else {
                   console.log('瀏覽器不支援語音合成功能');
               }
           }
           
           // 確保語音功能在頁面加載時初始化語音列表 - iOS兼容
           let voicesLoaded = false;
           window.speechSynthesis.onvoiceschanged = function() {
               if (!voicesLoaded) {
                   voicesLoaded = true;
                   console.log("語音列表已載入");
               }
           };
           
           // 頁面載入時預先載入語音
           setTimeout(() => {
               speechSynthesis.getVoices(); // 觸發語音載入
           }, 100);
            
            // 添加到歷史記錄
            function addToHistory(number) {
                const item = document.createElement('div');
                item.className = 'history-item';
                item.textContent = number;
                
                // 根據總數目比例上色（最多5種顏色）
                const colorCount = Math.min(5, totalNumber);
                const segmentSize = Math.ceil(totalNumber / colorCount);
                const colorIndex = Math.min(Math.floor((number - 1) / segmentSize), colorCount - 1);
                const colors = ['#d4af37', '#a67c00', '#b8860b', '#c9ae5d', '#d4af37'];
                
                item.style.setProperty('--border-color', colors[colorIndex]);
                
                historyListEl.appendChild(item);
                historyListEl.scrollTop = historyListEl.scrollHeight;
            }
            
            // 重置所有
            function resetAll() {
                if (isAnimating) return;
                
                // 重新生成數字陣列
                numbers = Array.from({length: totalNumber}, (_, i) => i + 1);
                drawnNumbers = [];
                clearDrawnNumbersFromStorage();
                
                currentNumberEl.textContent = '?';
                historyListEl.innerHTML = '';
                updateDrawnCount();
                
                drawBtn.textContent = '抽獎';
                drawBtn.style.background = 'linear-gradient(to right, #d4af37, #b8860b)';
            }
            
            // 更新已抽取數量
            function updateDrawnCount() {
                drawnCountEl.textContent = drawnNumbers.length;
            }
        });
    </script>
</body>
</html>
